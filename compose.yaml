name: money-graph

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PYTHON_BIN: /opt/venv/bin/python
      RUNS_DIR: /workspace/runs
      PYTHON_TIMEOUT_MS: ${PYTHON_TIMEOUT_MS:-330000}
      UPLOAD_TIMEOUT_MS: ${UPLOAD_TIMEOUT_MS:-300000}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-134217728}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - ./runs:/workspace/runs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  analytics:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: analytics
    init: true
    volumes:
      - ./data:/data:ro
      - ./artifacts:/artifacts
    entrypoint: ["python", "-m", "money_graph"]
    command: ["--help"]
