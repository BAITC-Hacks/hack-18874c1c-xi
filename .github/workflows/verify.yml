name: Verify monorepo
on:
  push:
    branches: [main, ilya-branch-front, yerasyl-branch-back, rodion-branch-analytics]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: npm ci --no-audit --no-fund
      - run: npm run check:structure
      - run: npm test
      - run: npm run test:web
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck
      - run: npm run typecheck:acceptance
      - run: python -m pip install -r analytics/requirements.lock
      - run: python -m pip install --no-deps -e ./analytics
      - run: python -m unittest discover -s analytics/tests -v
      - run: python -m unittest discover -s scripts/acceptance -p 'test_*.py' -v
      - run: python -m money_graph --check-environment
      - run: docker compose config --quiet
