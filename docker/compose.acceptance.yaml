# Invoked only by scripts/acceptance/run.mjs with a unique project and report dir.
# No host ports, no production runs/ volume, no external runtime network.
x-python-check: &python-check
  image: ${COMPOSE_PROJECT_NAME}-acceptance-python
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: acceptance-python
  init: true
  volumes:
    - type: bind
      source: ${ACCEPTANCE_DATA_DIR:?Use the acceptance runner}
      target: /data
      read_only: true
    - type: bind
      source: ${ACCEPTANCE_REPORT_DIR:?Use the acceptance runner}
      target: /reports
  environment:
    MONEY_GRAPH_DATA_DIR: /data

services:
  pipeline:
    <<: *python-check
    command: ["sh", "-c", "python -m unittest discover -s analytics/tests -q && python -m unittest discover -s scripts/acceptance -p 'test_*.py' -v && python scripts/acceptance/pipeline.py --input-dir /data --report-dir /reports --mode official"]

  verify-downloads:
    <<: *python-check
    command: ["python", "scripts/acceptance/verify.py", "--input-dir", "/data", "--output-dir", "/reports/downloads", "--report", "/reports/download-verification.json", "--mode", "official"]

  checks:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: acceptance-js
    init: true

  api:
    image: ${COMPOSE_PROJECT_NAME}-api
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      WEB_ORIGIN: http://web:3000
      PYTHON_BIN: /opt/venv/bin/python
      RUNS_DIR: /reports/runs
      PYTHON_TIMEOUT_MS: 330000
    volumes:
      - type: bind
        source: ${ACCEPTANCE_REPORT_DIR:?Use the acceptance runner}
        target: /reports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  integration:
    image: ${COMPOSE_PROJECT_NAME}-api
    init: true
    environment:
      PYTHON_BIN: /opt/venv/bin/python
      REAL_DATA_DIR: /data
    volumes:
      - type: bind
        source: ${ACCEPTANCE_DATA_DIR:?Use the acceptance runner}
        target: /data
        read_only: true
    command: ["node", "--test", "apps/api/test/python-cli.integration.cjs", "apps/api/test/dataset.integration.cjs"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://api:3001/api
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  browser:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: acceptance-browser
    init: true
    shm_size: 1gb
    environment:
      WEB_URL: http://web:3000
      API_URL: http://api:3001/api
      DATA_DIR: /data
      REPORT_DIR: /reports
    volumes:
      - type: bind
        source: ${ACCEPTANCE_DATA_DIR:?Use the acceptance runner}
        target: /data
        read_only: true
      - type: bind
        source: ${ACCEPTANCE_REPORT_DIR:?Use the acceptance runner}
        target: /reports

networks:
  default:
    internal: true
